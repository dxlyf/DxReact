<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini React Concurrent - React 19 并发特性</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; padding: 40px 20px; color: #333; }
        .app-title { text-align: center; font-size: 28px; font-weight: 700; margin-bottom: 8px; color: #1a1a1a; }
        .app-subtitle { text-align: center; color: #999; font-size: 14px; margin-bottom: 40px; }
        .demo-grid { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .demo-section { background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .demo-section h3 { font-size: 15px; color: #1677ff; margin-bottom: 6px; font-weight: 600; }
        .demo-section .desc { font-size: 12px; color: #999; margin-bottom: 16px; }

        input, button { font-family: inherit; }
        .search-input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .search-input:focus { border-color: #4096ff; box-shadow: 0 0 0 2px rgba(24,144,255,0.1); }

        .item-list { margin-top: 12px; max-height: 300px; overflow-y: auto; border: 1px solid #f0f0f0; border-radius: 6px; }
        .item { padding: 8px 12px; font-size: 13px; border-bottom: 1px solid #fafafa; transition: background 0.15s; }
        .item:hover { background: #e6f4ff; }
        .item.highlight { font-weight: 600; color: #1677ff; }

        .btn { height: 36px; padding: 0 16px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #1677ff; color: #fff; }
        .btn-primary:hover { background: #4096ff; }
        .btn-default { background: #fff; color: #333; border: 1px solid #d9d9d9; }
        .btn-default:hover { border-color: #4096ff; color: #4096ff; }

        .tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 4px; font-size: 11px; margin-right: 4px; margin-bottom: 4px; }
        .tag-pending { background: #fff7e6; color: #fa8c16; border: 1px solid #ffd591; }
        .tag-active { background: #e6f7ff; color: #1677ff; border: 1px solid #91d5ff; }

        .stats { display: flex; gap: 16px; margin-bottom: 12px; }
        .stat-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #666; }
        .stat-value { font-weight: 700; color: #1677ff; font-size: 18px; }

        .loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: #999; font-size: 14px; }
        .spinner { width: 20px; height: 20px; border: 2px solid #f0f0f0; border-top-color: #1677ff; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-row { display: flex; gap: 8px; margin-top: 12px; }
        pre.code { background: #fafafa; border: 1px solid #f0f0f0; border-radius: 6px; padding: 12px; font-size: 12px; overflow-x: auto; color: #555; margin-top: 8px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import {
            createElement, Fragment, render,
            useState, useEffect, useRef, useMemo, useCallback,
            useTransition, useDeferredValue
        } from './react.ts'

        /** @jsx createElement */
        /** @jsxFrag Fragment */

        // ============================================================
        // 测试数据
        // ============================================================
        const ITEMS = Array.from({ length: 10000 }, (_, i) => ({
            id: i, text: `Item ${String(i).padStart(5, '0')}: ${Math.random().toString(36).slice(2, 8)}`,
            category: ['Tech', 'Design', 'Business', 'Health', 'Science'][i % 5]
        }))

        // ============================================================
        // Demo 1: 并发大列表渲染
        // ============================================================
        function ConcurrentListDemo() {
            const [showList, setShowList] = useState(false)
            const [count, setCount] = useState(0)
            const renderTime = useRef(0)

            function handleToggle() {
                const start = performance.now()
                setShowList(!showList)
                setTimeout(() => { renderTime.current = (performance.now() - start).toFixed(1) }, 0)
            }

            useEffect(() => {
                if (!showList) return
                const timer = setInterval(() => setCount(c => c + 1), 100)
                return () => clearInterval(timer)
            }, [showList])

            return createElement('div', null,
                createElement('div', { className: 'btn-row' },
                    createElement('button', { className: 'btn btn-primary', onClick: handleToggle },
                        showList ? '隐藏列表' : '渲染 10000 条数据'
                    ),
                    createElement('span', { style: 'font-size:12px;color:#888;align-self:center;' },
                        showList ? `渲染耗时: ${renderTime.current}ms | 计数器: ${count}` : ''
                    )
                ),
                showList && createElement('div', { className: 'item-list' },
                    ...ITEMS.map(item =>
                        createElement('div', { className: 'item', key: item.id },
                            createElement('span', { style: 'color:#999;margin-right:8px;' }, `[#${item.id}]`),
                            item.text,
                            createElement('span', { className: 'tag tag-active', style: 'float:right;' }, item.category)
                        )
                    )
                ),
                createElement('p', { style: 'font-size:11px;color:#aaa;margin-top:8px;' },
                    '即使渲染 10000 条数据，计数器仍以 10fps 更新 — 时间切片保证不阻塞 UI'
                )
            )
        }

        // ============================================================
        // Demo 2: useTransition 搜索
        // ============================================================
        function TransitionDemo() {
            const [query, setQuery] = useState('')
            const [results, setResults] = useState([])
            const [isPending, startTransition] = useTransition()
            const filterCount = useRef(0)

            const filtered = useMemo(() => {
                filterCount.current++
                if (!query) return ITEMS.slice(0, 50)
                const q = query.toLowerCase()
                let result = []
                for (let i = 0; i < ITEMS.length; i++) {
                    if (ITEMS[i].text.toLowerCase().includes(q) || ITEMS[i].category.toLowerCase().includes(q)) {
                        result.push(ITEMS[i])
                    }
                }
                return result.slice(0, 100)
            }, [query])

            function handleInput(e) {
                const val = e.target.value
                setQuery(val)
                startTransition(() => { setResults(filtered) })
            }

            const displayResults = results.length > 0 ? results : filtered

            return createElement('div', null,
                createElement('div', { style: 'margin-bottom:8px;' },
                    createElement('input', {
                        className: 'search-input',
                        placeholder: '搜索 10000 条数据 (useTransition)',
                        value: query,
                        onInput: handleInput
                    })
                ),
                createElement('div', { style: 'margin-bottom:4px;' },
                    isPending && createElement('span', { className: 'tag tag-pending' }, '🔄 渲染中...'),
                    createElement('span', { className: 'tag tag-active' }, `匹配 ${displayResults.length} 条`),
                    createElement('span', { style: 'font-size:11px;color:#999;margin-left:4px;' }, `过滤执行: ${filterCount.current} 次`)
                ),
                createElement('div', { className: 'item-list', style: 'max-height:200px;' },
                    ...displayResults.map(item =>
                        createElement('div', {
                            className: `item${query && item.text.toLowerCase().includes(query.toLowerCase()) ? ' highlight' : ''}`,
                            key: item.id
                        },
                            item.text,
                            createElement('span', { className: 'tag tag-active', style: 'float:right;' }, item.category)
                        )
                    )
                ),
                createElement('p', { style: 'font-size:11px;color:#aaa;margin-top:8px;' },
                    'useTransition: 输入框立即响应，搜索结果延迟渲染且可被中断'
                )
            )
        }

        // ============================================================
        // Demo 3: useDeferredValue 搜索
        // ============================================================
        function DeferredValueDemo() {
            const [input, setInput] = useState('')
            const deferredInput = useDeferredValue(input)

            const filtered = useMemo(() => {
                if (!deferredInput) return ITEMS.slice(0, 30)
                const q = deferredInput.toLowerCase()
                const r = []
                for (let i = 0; i < ITEMS.length; i++) {
                    if (ITEMS[i].text.toLowerCase().includes(q)) r.push(ITEMS[i])
                    if (r.length >= 30) break
                }
                return r
            }, [deferredInput])

            const isStale = input !== deferredInput

            return createElement('div', null,
                createElement('input', {
                    className: 'search-input',
                    placeholder: '搜索 (useDeferredValue)',
                    value: input,
                    onInput: (e) => setInput(e.target.value)
                }),
                createElement('div', { style: 'margin-top:8px;' },
                    createElement('span', { style: 'margin-right:8px;' }, '当前值: ', createElement('strong', null, input)),
                    createElement('span', null, '延迟值: ', createElement('strong', { style: 'color:#1677ff;' }, deferredInput)),
                    isStale && createElement('span', { className: 'tag tag-pending', style: 'margin-left:8px;' }, '非同步')
                ),
                createElement('div', { className: 'item-list', style: 'max-height:200px;margin-top:8px;' },
                    ...filtered.map(item =>
                        createElement('div', { className: 'item', key: item.id }, item.text)
                    )
                ),
                createElement('p', { style: 'font-size:11px;color:#aaa;margin-top:8px;' },
                    'useDeferredValue: 输入框始终保持响应，搜索结果使用延迟值更新'
                )
            )
        }

        // ============================================================
        // Demo 4: useMemo / useCallback
        // ============================================================
        function MemoCallbackDemo() {
            const [count, setCount] = useState(0)
            const [text, setText] = useState('')
            const [dummy, setDummy] = useState(0)

            const expensiveValue = useMemo(() => {
                let result = 0
                for (let i = 0; i < 1000000; i++) result += Math.sin(i) * Math.cos(i)
                return { value: result.toFixed(6), count }
            }, [count])

            const handleClick = useCallback(() => setCount(c => c + 1), [])
            const handleTextChange = useCallback((e) => setText(e.target.value), [])

            return createElement('div', null,
                createElement('div', { className: 'stats' },
                    createElement('div', { className: 'stat-item' },
                        createElement('span', null, 'useMemo 计算结果:'),
                        createElement('span', { className: 'stat-value', style: 'font-size:13px;' }, expensiveValue.value)
                    )
                ),
                createElement('div', { className: 'stats' },
                    createElement('div', { className: 'stat-item' },
                        createElement('span', null, '依赖 count:'),
                        createElement('span', { className: 'stat-value' }, expensiveValue.count)
                    )
                ),
                createElement('div', { className: 'btn-row' },
                    createElement('button', { className: 'btn btn-primary', onClick: handleClick }, `count +1 (${count})`),
                    createElement('button', { className: 'btn btn-default', onClick: () => setDummy(d => d + 1) }, `无关更新 (${dummy})`)
                ),
                createElement('div', { style: 'margin-top:12px;' },
                    createElement('input', {
                        className: 'search-input',
                        placeholder: '输入文本 (useCallback 稳定引用)',
                        value: text,
                        onInput: handleTextChange
                    }),
                    createElement('span', { style: 'font-size:11px;color:#888;display:block;margin-top:4px;' },
                        `文本: ${text || '(空)'}`
                    )
                ),
                createElement('p', { style: 'font-size:11px;color:#aaa;margin-top:8px;' },
                    'useMemo 仅在 count 变化时重新计算，useCallback 返回稳定函数引用'
                ),
                createElement('pre', { className: 'code' },
                    `useMemo(() => heavyCalc(count), [count])\nuseCallback(handler, [deps])`
                )
            )
        }

        // ============================================================
        // Demo 5: Suspense 模拟
        // ============================================================
        function SuspenseDemo() {
            const [loading, setLoading] = useState(false)
            const [data, setData] = useState(null)
            const [error, setError] = useState(null)

            function fetchData() {
                setLoading(true); setError(null)
                setTimeout(() => {
                    setLoading(false)
                    setData({
                        title: 'Suspense 原理',
                        items: ['异步数据加载时显示 fallback', 'React 19 原生支持 Suspense', '配合 use() hook 使用更优雅'],
                        timestamp: new Date().toLocaleTimeString()
                    })
                }, 2000)
            }

            function fetchWithError() {
                setLoading(true); setError(null)
                setTimeout(() => {
                    setLoading(false)
                    setError('Network Error: Connection timeout')
                }, 1500)
            }

            useEffect(() => { fetchData() }, [])

            return createElement('div', null,
                createElement('div', { className: 'btn-row' },
                    createElement('button', { className: 'btn btn-primary', onClick: fetchData }, '重新加载'),
                    createElement('button', { className: 'btn btn-default', onClick: fetchWithError }, '模拟错误')
                ),
                createElement('div', { style: 'margin-top:12px;min-height:120px;' },
                    loading && createElement('div', { className: 'loading' },
                        createElement('span', { className: 'spinner' }),
                        'Loading... (Suspense fallback 替代)'
                    ),
                    error && createElement('div', { style: 'padding:16px;background:#fff2f0;border:1px solid #ffccc7;border-radius:6px;color:#ff4d4f;font-size:13px;' }, error),
                    !loading && !error && data && createElement('div', null,
                        createElement('div', { style: 'font-weight:600;margin-bottom:8px;color:#1677ff;' }, data.title),
                        ...data.items.map((item, i) =>
                            createElement('div', { key: i, style: 'padding:4px 0;font-size:13px;' }, `${i + 1}. ${item}`)
                        ),
                        createElement('div', { style: 'font-size:11px;color:#999;margin-top:8px;' }, `加载时间: ${data.timestamp}`)
                    )
                ),
                createElement('p', { style: 'font-size:11px;color:#aaa;margin-top:8px;' },
                    'Suspense: 组件可以暂停渲染，等待异步操作完成后继续'
                ),
                createElement('pre', { className: 'code' },
                    `<Suspense fallback={<Loading />}>\n  <AsyncComponent />\n</Suspense>`
                )
            )
        }

        // ============================================================
        // Demo 6: useRef 基准
        // ============================================================
        function UseRefDemo() {
            const [count, setCount] = useState(0)
            const countRef = useRef(0)
            const renderCount = useRef(0)
            renderCount.current++

            return createElement('div', null,
                createElement('div', { className: 'stats' },
                    createElement('div', { className: 'stat-item' },
                        createElement('span', null, 'state count:'),
                        createElement('span', { className: 'stat-value' }, count)
                    ),
                    createElement('div', { className: 'stat-item' },
                        createElement('span', null, 'ref count:'),
                        createElement('span', { className: 'stat-value', style: 'color:#52c41a;' }, countRef.current)
                    ),
                    createElement('div', { className: 'stat-item' },
                        createElement('span', null, '渲染次数:'),
                        createElement('span', { className: 'stat-value', style: 'color:#fa8c16;' }, renderCount.current)
                    )
                ),
                createElement('button', { className: 'btn btn-primary', onClick: () => { countRef.current++; setCount(c => c + 1) } }, 'Increment'),
                createElement('p', { style: 'font-size:11px;color:#aaa;margin-top:8px;' },
                    'useRef: 可变引用，修改不触发重渲染，始终同步更新'
                ),
                createElement('pre', { className: 'code' },
                    `const ref = useRef(0)\nref.current++  // 不触发渲染\nsetCount()     // 触发渲染`
                )
            )
        }

        // ============================================================
        // 主 App
        // ============================================================
        function App() {
            return createElement(Fragment, null,
                createElement('h1', { className: 'app-title' }, 'Mini React Concurrent'),
                createElement('p', { className: 'app-subtitle' },
                    'React 19 并发特性: Lane 优先级调度 · useTransition · useDeferredValue · Suspense · 时间切片'
                )
            )
        }

        // ============================================================
        // 启动
        // ============================================================
        console.log('Mini React Concurrent - Boot (module imports from react.js + scheduler.js)')
        render(createElement(App), document.getElementById('root'))
    </script>
</body>
</html>
